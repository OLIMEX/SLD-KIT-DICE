;
; SLD-KIT-DICE firmware (CH32V003J4M6, ch32fun)
;
;   pio run -t upload               ; the dice (release build, default)
;   pio run -e blink -t upload      ; hardware test: LEDs, speaker, shock sensor
;   pio run -e dice_diag -t upload  ; dice + start-up diagnostics, crash hold
;   pio run -e dice_test -t upload  ; dice, SWIO always on (statistics readable)

[platformio]
default_envs = dice

[env]
platform = ch32v
framework = ch32v003fun
board = genericCH32V003J4M6
upload_protocol = minichlink
; the real clock is set in include/funconfig.h (24 MHz HSI, no PLL);
; these two only keep PlatformIO's printout consistent
board_build.clock_source = hsi
board_build.f_cpu = 24000000L
build_flags = -Os -Wall
; after each build, copy firmware.bin to firmware/<env>.bin
extra_scripts = post:scripts/copy_firmware.py

; the dice: what goes on the boards
[env:dice]
build_src_filter = +<hal.c> +<dice/>

; hardware test for newly assembled boards
[env:blink]
build_src_filter = +<hal.c> +<blink/>

; dice with start-up diagnostics (reset cause, crash record) and a 5 s
; programming window; stops after a caught crash so it can be read
[env:dice_diag]
build_src_filter = +<hal.c> +<dice/>
build_flags = ${env.build_flags} -DDIAG=1

; dice with SWIO never turned off and no standby: LED7 (centre) stays dark,
; but the chip can be programmed and its RAM (statistics, crash record) read
; at any time. Draws ~1.6 mA all the time: for the bench only.
[env:dice_test]
build_src_filter = +<hal.c> +<dice/>
build_flags = ${env.build_flags} -DDIAG=1 -DKEEP_SWIO=1
